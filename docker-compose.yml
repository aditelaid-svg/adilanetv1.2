# ============================================================
#  AdilaNet — WiFi Voucher Mikrotik
#  Deploy via Dockge / Docker Compose
#
#  ADA 2 MODE — pilih salah satu di bagian service "app":
#
#  MODE A (Direkomendasikan): Pakai image dari GitHub Actions
#    → Ganti GITHUB_USERNAME/NAMA_REPO di bawah dengan repo kamu
#    → Setiap push ke GitHub, image otomatis ter-build
#    → Di Dockge: klik "Pull & Restart" untuk update ke versi terbaru
#
#  MODE B: Build langsung dari source di GitHub (lama, tapi tanpa setup)
#    → Comment baris `image:` dan uncomment blok `build:`
#
#  SEBELUM RUNNING:
#    1. Ganti placeholder GITHUB_USERNAME/NAMA_REPO
#    2. Isi SESSION_SECRET dengan string acak panjang
#    3. Ubah password DB sesuai kebutuhan
#    4. Pastikan repo GitHub sudah Public (atau setup token untuk private)
# ============================================================

services:

  # ── Database PostgreSQL ─────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: adilanet_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: adilanet
      POSTGRES_USER: adilanet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adilanet -d adilanet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adilanet_net

  # ── Aplikasi AdilaNet ───────────────────────────────────────
  app:
    # ── MODE A: Pakai image dari GitHub Container Registry ──
    # Image di-build otomatis oleh GitHub Actions setiap kali ada push.
    # Ganti GITHUB_USERNAME/NAMA_REPO sesuai repo kamu di GitHub.
    # Contoh: ghcr.io/budi123/adilanet:latest
    image: ghcr.io/GITHUB_USERNAME/NAMA_REPO:latest

    # ── MODE B: Build dari source GitHub (uncomment jika pakai mode ini) ──
    # build:
    #   context: https://github.com/GITHUB_USERNAME/NAMA_REPO.git#main
    #   # Untuk build dari folder lokal:
    #   # context: .

    container_name: adilanet_app
    restart: unless-stopped
    ports:
      - "5000:5000"       # Akses lewat http://IP_SERVER:5000
    environment:
      NODE_ENV: production
      PORT: 5000
      # Isi DATABASE_URL di .env privat. Gunakan kredensial DB yang sudah ada
      # untuk deployment lama; jangan merotasi password saat memperbarui compose.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the private .env file}
      # Gunakan SESSION_SECRET yang sudah ada pada deployment lama.
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the private .env file}
      # Biarkan "false" kalau akses lewat HTTP (mis. http://IP:5000).
      # Set "true" HANYA jika app sudah di belakang HTTPS (domain + TLS).
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # PPOB Digiflazz: isi di file .env privat, jangan commit kredensial.
      # Layanan tetap terkunci tanpa kredensial lengkap + HTTPS/cookie secure.
      DIGIFLAZZ_USERNAME: "${DIGIFLAZZ_USERNAME:-}"
      DIGIFLAZZ_API_KEY: "${DIGIFLAZZ_API_KEY:-}"
      DIGIFLAZZ_WEBHOOK_SECRET: "${DIGIFLAZZ_WEBHOOK_SECRET:-}"
      # Catatan: Merchant Code & API Key Sanpay TIDAK diisi di sini.
      # Cukup masukkan lewat menu Pengaturan di panel admin setelah app jalan.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - adilanet_net

networks:
  adilanet_net:
    driver: bridge

volumes:
  db_data:
    driver: local
