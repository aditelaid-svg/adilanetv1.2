name: Validate Docker Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            architecture: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            architecture: aarch64
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          echo "Commit: ${GITHUB_SHA}"
          actual_architecture="$(uname -m)"
          echo "Runner architecture: ${actual_architecture}"
          test "${actual_architecture}" = "${EXPECTED_ARCHITECTURE}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Report Node and npm versions
        run: |
          node --version
          npm --version
          echo "npm omit setting: $(npm config get omit)"

      - name: Install locked dependencies
        id: npm_ci
        run: |
          npm ci --include=dev
          test -x node_modules/.bin/tsx

      - name: Print sanitized npm failure details
        if: failure() && steps.npm_ci.outcome == 'failure'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const logDir = path.join(process.env.HOME, ".npm", "_logs");
          const logs = fs.existsSync(logDir)
            ? fs.readdirSync(logDir)
                .filter((name) => name.endsWith("-debug-0.log"))
                .map((name) => ({
                  name,
                  mtime: fs.statSync(path.join(logDir, name)).mtimeMs,
                }))
                .sort((a, b) => b.mtime - a.mtime)
            : [];

          if (!logs.length) {
            console.log("No npm debug log was available.");
            process.exit(0);
          }

          const logPath = path.join(logDir, logs[0].name);
          console.log(`Sanitized diagnostics from ${logs[0].name}:`);
          const diagnosticLine =
            /verbose cli|info using npm|info using node|verbose title|verbose argv|verbose cwd|verbose os|verbose arch|verbose exit|error/i;
          for (const line of fs.readFileSync(logPath, "utf8").split(/\r?\n/)) {
            if (!diagnosticLine.test(line)) continue;
            const safeLine = line
              .replace(/https?:\/\/\S+/gi, "[URL REDACTED]")
              .replace(
                /(authorization|_authToken|token|password|_auth)\s*[:=]\s*\S+/gi,
                "$1=[REDACTED]",
              )
              .replace(/\bBearer\s+\S+/gi, "Bearer [REDACTED]")
              .replace(/\b(?:npm_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g, "[TOKEN REDACTED]");
            console.log(safeLine);
          }
          NODE

      - name: Run application tests
        run: |
          npm run test:ppob
          npm run test:qiospay
          npm run test:hotspot

      - name: Run lint and application build
        run: |
          npm run lint
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
