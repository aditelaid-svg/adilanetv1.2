name: Validate Docker Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            architecture: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            architecture: aarch64
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          echo "Commit: ${GITHUB_SHA}"
          actual_architecture="$(uname -m)"
          echo "Runner architecture: ${actual_architecture}"
          test "${actual_architecture}" = "${EXPECTED_ARCHITECTURE}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Report Node and npm versions
        run: |
          node --version
          npm --version
          echo "npm omit setting: $(npm config get omit)"

      - name: Install locked dependencies
        run: |
          npm ci --include=dev
          test -x node_modules/.bin/tsx

      - name: Run application tests
        run: |
          npm run test:ppob
          npm run test:qiospay
          npm run test:hotspot

      - name: Run lint and application build
        run: |
          npm run lint
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
