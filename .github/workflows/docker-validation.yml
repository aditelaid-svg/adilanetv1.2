name: Validate Docker Platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            architecture: x86_64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            architecture: aarch64
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify native runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          echo "Commit: ${GITHUB_SHA}"
          actual_architecture="$(uname -m)"
          echo "Runner architecture: ${actual_architecture}"
          test "${actual_architecture}" = "${EXPECTED_ARCHITECTURE}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Report Node and npm versions
        run: |
          node --version
          npm --version
          echo "npm omit setting: $(npm config get omit)"
          echo "npm bin-links setting: $(npm config get bin-links)"

      - name: Normalize lockfile URLs in runner workspace
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const internalHosts = new Set([
            "package-firewall.replit.local",
            "package-firewall.replit.internal",
          ]);
          let normalized = 0;
          for (const [name, entry] of Object.entries(lock.packages ?? {})) {
            if (!entry.resolved) continue;
            const url = new URL(entry.resolved);
            if (!internalHosts.has(url.hostname)) continue;
            if (!url.pathname.startsWith("/npm/")) {
              throw new Error(`Unexpected package proxy path for ${name}`);
            }
            if (!entry.integrity) {
              throw new Error(`Missing integrity hash for ${name}`);
            }
            entry.resolved = `https://registry.npmjs.org/${url.pathname.slice(5)}${url.search}`;
            normalized++;
          }
          fs.writeFileSync("package-lock.json", `${JSON.stringify(lock, null, 2)}\n`);
          console.log(`Normalized ${normalized} internal package URLs; integrity hashes preserved.`);
          NODE

      - name: Install locked dependencies
        id: npm_ci
        run: |
          npm ci --include=dev --bin-links=true \
            --registry=https://registry.npmjs.org/ \
            --replace-registry-host=always
          test -x node_modules/.bin/tsx

      - name: Print sanitized npm failure details
        if: failure() && steps.npm_ci.outcome == 'failure'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const logDir = path.join(process.env.HOME, ".npm", "_logs");
          const logs = fs.existsSync(logDir)
            ? fs.readdirSync(logDir)
                .filter((name) => name.endsWith("-debug-0.log"))
                .map((name) => ({
                  name,
                  mtime: fs.statSync(path.join(logDir, name)).mtimeMs,
                }))
                .sort((a, b) => b.mtime - a.mtime)
            : [];

          if (!logs.length) {
            console.log("No npm debug log was available.");
            process.exit(0);
          }

          const logPath = path.join(logDir, logs[0].name);
          console.log(`Sanitized diagnostics from ${logs[0].name}:`);
          console.log(`npm bin-links: ${require("node:child_process").execSync("npm config get bin-links", { encoding: "utf8" }).trim()}`);
          console.log(`npm omit: ${require("node:child_process").execSync("npm config get omit", { encoding: "utf8" }).trim() || "(empty)"}`);
          require("node:child_process").execSync("npm ls tsx --depth=0 || true", { stdio: "inherit" });
          for (const name of ["node_modules/tsx/package.json", "node_modules/.bin/tsx"]) {
            const fullPath = path.resolve(name);
            if (!fs.existsSync(fullPath)) {
              console.log(`${name}: missing`);
              continue;
            }
            const stat = fs.lstatSync(fullPath);
            console.log(`${name}: present, mode=${(stat.mode & 0o777).toString(8)}${stat.isSymbolicLink() ? `, link=${fs.readlinkSync(fullPath)}` : ""}`);
          }
          const diagnosticLine =
            /^\d+ (?:verbose (?:cli|title|argv|cwd|os|arch|exit|stack)|info using (?:npm|node)|error(?:\s|$)|http fetch .* (?:4\d\d|5\d\d|ECONN|EAI_|ETIMEDOUT))/i;
          for (const line of fs.readFileSync(logPath, "utf8").split(/\r?\n/)) {
            if (!diagnosticLine.test(line)) continue;
            const safeLine = line
              .replace(/https?:\/\/\S+/gi, "[URL REDACTED]")
              .replace(
                /(authorization|_authToken|token|password|_auth)\s*[:=]\s*\S+/gi,
                "$1=[REDACTED]",
              )
              .replace(/\bBearer\s+\S+/gi, "Bearer [REDACTED]")
              .replace(/\b(?:npm_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})\b/g, "[TOKEN REDACTED]");
            console.log(safeLine);
          }
          NODE

      - name: Run application tests
        run: |
          npm run test:ppob
          npm run test:qiospay
          npm run test:hotspot

      - name: Run lint and application build
        run: |
          npm run lint
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          provenance: false
